[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-cricket-analytics"
version = "0.2.0"
description = "Reusable Cricsheet ingestion and descriptive cricket analytics"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Open Cricket Analytics contributors" }]
dependencies = ["pandas>=2.2,<3.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
app = ["streamlit>=1.40", "plotly>=5.24"]
notebooks = ["jupyterlab>=4.2", "ipykernel>=6.29", "plotly>=5.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
